name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Syntax/lint check (maintained code only)
        run: ruff check src scripts tests

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (core CPU-only dependencies)
        run: pip install -e .[dev]
      - name: Run unit tests (excluding slow end-to-end smoke)
        run: pytest -m "not slow" -q

  smoke-workflow:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .[dev]
      - name: Run reduced nested-CV workflow on real data (CPU-only)
        run: |
          python scripts/run_nested_cv.py --region BA11 --n-iter 4 --n-inner 2
          python scripts/verify_results.py --check-paper
          python scripts/verify_results.py
