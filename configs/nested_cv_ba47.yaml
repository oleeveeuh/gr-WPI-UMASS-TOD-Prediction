# Leakage-free nested cross-validation configuration for BA47.
# Results are NEW (produced after publication) and are not the paper's results.
region: BA47
data_file: data/processed/BA47_data_6_17_2024.csv
target_column: TOD
n_outer_folds: 5
n_inner_folds: 3
n_iter: 12
n_bins: 4
pca_variance: 0.90
random_state: 42
estimators:
  - Ridge
  - RandomForest
  - ExtraTrees
  - AdaBoost
  - HistGradientBoosting
